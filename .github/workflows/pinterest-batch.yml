name: Pick next Pinterest batch

on:
  # جدول زمني: كل 3 ساعات (بدّلها حسب الوتيرة اللي بغيتي)
  schedule:
    - cron: "0 */3 * * *"

  # تشغيل يدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pick-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick next batch
        run: python3 scripts/pick_batch.py images.json published.json next-batch.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next-batch.json published.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير"
          else
            git commit -m "chore: pick next pinterest batch [automated]"
            git push
          fi
